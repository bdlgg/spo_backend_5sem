image: mcr.microsoft.com/dotnet/sdk:10.0

stages:
  - build
  - test

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .nuget/

variables:
  NUGET_PACKAGES: ${CI_PROJECT_DIR}/.nuget/

before_script:
  - dotnet restore Tests/Tests.csproj

build:
  stage: build
  script:
    - dotnet build Tests/Tests.csproj --configuration Release --no-restore

test:
  stage: test
  script:
    - dotnet test Tests/Tests.csproj --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"
  artifacts:
    when: always
    paths:
      - Tests/TestResults/test-results.trx
    expire_in: 1 week
